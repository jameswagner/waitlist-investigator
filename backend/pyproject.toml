[project]
name = "waitlist-investigator-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic-ai-slim[ag-ui,openai,anthropic]",
  "fastapi",
  "uvicorn",
  "python-dotenv",
]

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
